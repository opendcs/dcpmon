generatorName: typescript-axios
inputSpec: /local/api-client/dds-http.yaml
outputDir: /local/api-client/generated

additionalProperties:
  npmName: dds-api
  npmVersion: 1.0.0
  supportsES6: true
  withSeparateModelsAndApi: true
  useSingleRequestParameter: true
  modelPropertyNaming: camelCase
  withInterfaces: true
  apiPackage: api
  modelPackage: model
